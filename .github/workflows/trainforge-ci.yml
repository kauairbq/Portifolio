name: TrainForge CI

on:
  push:
    paths:
      - "projects/TrainForge/**"
      - ".github/workflows/trainforge-ci.yml"
  pull_request:
    paths:
      - "projects/TrainForge/**"
      - ".github/workflows/trainforge-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: trainforge
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: projects/TrainForge/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            projects/TrainForge/backend/package-lock.json
            projects/TrainForge/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL and apply schema + seed
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: trainforge
        run: |
          node -e "const mysql=require('mysql2/promise'); const fs=require('fs'); const path=require('path'); (async()=>{ let conn; for(let i=0;i<30;i++){ try{ conn=await mysql.createConnection({host:process.env.DB_HOST, port:Number(process.env.DB_PORT), user:process.env.DB_USER, password:process.env.DB_PASSWORD, multipleStatements:true}); break; } catch(e){ await new Promise(r=>setTimeout(r,2000)); } } if(!conn){ throw new Error('MySQL not ready'); } const schema=fs.readFileSync(path.resolve('..','database','schema.sql'),'utf8'); const seed=fs.readFileSync(path.resolve('..','database','seed.sql'),'utf8'); await conn.query(schema); await conn.query(seed); await conn.end(); console.log('Database ready'); })().catch(err=>{ console.error(err); process.exit(1); });"

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Run backend tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: trainforge
          JWT_SECRET: trainforge-ci-secret
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/TrainForge/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/TrainForge/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build
