version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: 03101812@
      POSTGRES_DB: workflow_engine
    ports:
      - "5434:5432"
    volumes:
      - workflow_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6381:6379"
volumes:
  workflow_pg:
